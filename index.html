<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Malware Lab</title>
<style>
:root{--bg:#f2f3f5;--surface:#fff;--sunk:#e8eaee;--line:#d0d4db;--fg:#1b1f27;--muted:#5a6170;--accent:#5b4bd6;--accent-fg:#fff;--bad:#b3372b}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--surface:#181b22;--sunk:#0c0e12;--line:#2a2f3a;--fg:#e4e6ec;--muted:#959cab;--accent:#9d90ff;--accent-fg:#14102e;--bad:#ef7a6c;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;display:grid;gap:14px}
.eb{font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:24px}
p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--sunk);color:var(--fg);font:inherit}
label.rm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
button{padding:10px 14px;border:0;border-radius:4px;background:var(--accent);color:var(--accent-fg);font:600 15px/1 inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:14px;min-height:1.3em;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <span class="eb">Team access only</span>
  <h1>Malware Lab</h1>
  <p><strong style="color:var(--fg)">What is our office SSID?</strong><br>Hint: it starts with R.</p>
  <input type="text" name="username" value="ctf-team" autocomplete="username" hidden>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Your answer" required autofocus>
  <label class="rm"><input type="checkbox" id="rm"> Remember on this device</label>
  <button id="go" type="submit">Unlock</button>
  <p class="err" id="err" aria-live="polite"></p>
</form>

const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function derive(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},base,256);}
async function unlock(raw){const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},key,u8(P.c));
  const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();}
(async()=>{let k=null;try{k=localStorage.getItem(RK);}catch(e){}
  if(k){try{await unlock(u8(k));return;}catch(e){try{localStorage.removeItem(RK);}catch(_){}}}})();
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();
  const go=document.getElementById("go"),err=document.getElementById("err");
  if(!window.crypto||!crypto.subtle){err.textContent="This page must be opened over https.";return;}
  go.disabled=true;go.textContent="Checking...";err.textContent="";
  try{const raw=await derive(document.getElementById("pw").value.trim().toLowerCase());
    if(document.getElementById("rm").checked){try{localStorage.setItem(RK,b64(raw));}catch(_){}}
    await unlock(raw);
  }catch(x){go.disabled=false;go.textContent="Unlock";err.textContent="Not correct. Try again.";}
});
